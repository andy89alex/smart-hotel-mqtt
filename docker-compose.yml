services:
  broker:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./broker/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  room-simulator:
    build: ./room-simulator
    environment:
      BROKER_URL: tcp://broker:1883
    depends_on:
      - broker

  dashboard:
    build: ./dashboard
    ports:
      - "8080:8080"
    environment:
      BROKER_URL: tcp://broker:1883
    depends_on:
      - broker
